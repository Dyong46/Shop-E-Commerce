server.port=${SERVER_PORT:1203}

#connect database SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;database=Shopee;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.encrypt=true
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto = none

#configration Swagger
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

#configration mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smpt.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

# Security Configuration
logging.level.com.poly=INFO
logging.level.org.springframework.security=INFO
